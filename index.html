<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOHAMMED PS4 HOST</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
    background:
        radial-gradient(circle at 50% 25%,#4b3900 0%,#151515 35%,#050505 75%);
}

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:25px 15px 40px;
}

.logo{
    font-size:70px;
    font-weight:900;
    color:#ffd21a;
    text-shadow:
        0 0 10px #ffd21a,
        0 0 30px #9c7300;
    letter-spacing:8px;
}

.title{
    font-size:42px;
    font-weight:900;
    color:#ffd21a;
    margin-top:10px;
    text-shadow:0 0 15px #8f6900;
}

.subtitle{
    color:#aaa;
    letter-spacing:3px;
    margin-bottom:30px;
}

.card{
    background:rgba(10,10,10,.88);
    border:1px solid #856300;
    border-radius:20px;
    padding:25px;
    box-shadow:
        0 0 30px rgba(255,190,0,.12),
        inset 0 0 30px rgba(255,190,0,.03);
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

button{
    height:58px;
    border-radius:12px;
    border:1px solid #b98a00;
    background:linear-gradient(#292000,#100e05);
    color:#ffd21a;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 12px #000;
}

button:active{
    transform:scale(.97);
    background:#ffd21a;
    color:#000;
}

.status{
    margin-top:25px;
    padding:15px;
    border-radius:10px;
    background:#111;
    color:#ccc;
}

.phone{
    margin-top:25px;
    font-size:28px;
    font-weight:900;
    color:#ffd21a;
    letter-spacing:2px;
}

.footer{
    margin-top:25px;
    color:#777;
    font-size:12px;
    letter-spacing:2px;
}

@media(max-width:600px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .logo{
        font-size:50px;
    }

    .title{
        font-size:30px;
    }

    .phone{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">M</div>

    <div class="title">
        MOHAMMED
    </div>

    <div class="subtitle">
        PS4 HOST • GOLDHEN
    </div>

    <div class="card">

        <div class="grid">

            <button>5.05</button>
            <button>6.72</button>
            <button>7.02</button>

            <button>7.55</button>
            <button>9.00</button>
            <button>9.03</button>

            <button>9.60</button>
            <button>10.00</button>
            <button>11.00</button>

            <button>11.02 - 13.00</button>
            <button>13.02 - 13.52</button>

        </div>

        <div class="status">
            Select your PS4 Firmware
        </div>

        <div class="phone">
            +249 917 463 838
        </div>

    </div>

    <div class="footer">
        MOHAMMED PS4 HOST • PS4 EXPLOIT • GOLDHEN
    </div>

</div>

</body>
      </html>
