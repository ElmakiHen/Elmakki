<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOHAMMED PS4 HOST</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 25%, #4b3900, #151515 40%, #050505 80%);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 700px;
    padding: 20px;
}

.logo {
    font-size: 70px;
    font-weight: 900;
    color: #ffd21a;
    text-shadow: 0 0 15px #ffd21a, 0 0 35px #9c7300;
}

.title {
    margin-top: 5px;
    font-size: 38px;
    font-weight: 900;
    color: #ffd21a;
}

.subtitle {
    margin: 8px 0 30px;
    color: #aaa;
    letter-spacing: 3px;
}

.card {
    padding: 30px;
    background: rgba(10,10,10,.9);
    border: 1px solid #856300;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,190,0,.15);
}

button {
    width: 100%;
    height: 70px;
    border: 1px solid #b98a00;
    border-radius: 14px;
    background: linear-gradient(#292000, #100e05);
    color: #ffd21a;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 15px #000;
}

button:active {
    transform: scale(.97);
}

.status {
    margin-top: 20px;
    padding: 14px;
    background: #111;
    border-radius: 10px;
    color: #aaa;
}

.phone {
    margin-top: 20px;
    color: #ffd21a;
    font-weight: bold;
}

.footer {
    margin-top: 20px;
    color: #666;
    font-size: 11px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">M</div>

    <div class="title">MOHAMMED</div>

    <div class="subtitle">
        PS4 HOST • GOLDHEN
    </div>

    <div class="card">

        <button onclick="showStatus()">
            13.02 - 13.52
        </button>

        <div class="status" id="status">
            Select your PS4 Firmware
        </div>

        <div class="phone">
            +249 917 463 838
        </div>

    </div>

    <div class="footer">
        MOHAMMED PS4 HOST
    </div>

</div>

<script>
function showStatus() {
    const status = document.getElementById("status");
    const ua = navigator.userAgent.toLowerCase();

    if (ua.includes("playstation")) {
        status.textContent = "WAIT FOR JAILBREAK...";
    } else {
        status.textContent = "FIRMWARE NOT SUPPORTED";
    }
}
</script>

</body>
</html>
